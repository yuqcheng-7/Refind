<!doctype html>
<html lang="zh-CN">

    <style>
      body {
        font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0;
        padding: 14px 16px;
        width: 280px;
        color: #1f2a37;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 15px;
      }

        margin: 0 0 10px;

    <h1>拾藏连接</h1>
    <p>请在拾藏网站设置页点击「连接」，扩展会自动读取你已登录的平台会话。</p>
    <ol>
      <li>用 Chrome 打开并登录小红书 / 抖音等</li>
